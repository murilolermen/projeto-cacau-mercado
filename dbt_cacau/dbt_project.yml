name: "cacau"
version: "1.0.0"
config-version: 2

# Precisa bater com o nome do profile em profiles.yml.
profile: "cacau"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  cacau:
    staging:
      +materialized: view # staging é 1:1 com a fonte (ADR-004) — não custa
      # nada manter como view, sem duplicar dado do schema raw.
      +schema: staging

seeds:
  cacau:
    # Schema próprio, separado de staging: seed é dado curado à mão, não
    # derivado de raw — misturar os dois no mesmo schema confundiria a
    # linhagem (ADR-004 é sobre dado que vem da fonte, isso não vem).
    +schema: seeds
